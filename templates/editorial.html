<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<meta name="theme-color" content="#471616" />
<link rel="canonical" href="{{canonical}}" />
{{alternates}}
<meta property="og:type" content="{{ogtype}}" />

<meta property="og:url" content="{{canonical}}" />
<meta property="og:image" content="{{image}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{title}}" />
<meta name="twitter:description" content="{{description}}" />
<meta name="twitter:image" content="{{image}}" />
<link rel="icon" href="/assets/img/logo.png" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/desktop.css" />
<link rel="stylesheet" href="/css/mobile.css" />
<link rel="stylesheet" href="/css/language.css" />
<link rel="stylesheet" href="/css/articles.css" />
<script src="/js/scale.js"></script>
<script type="application/ld+json">{{schema}}</script>
</head>
<body class="editorial-body">

{{header}}
<main id="content" class="editorial">{{content}}</main>
<footer class="editorial-footer"><a href="{{home}}">{{brand}}</a><a href="{{archive}}">{{articlesLabel}}</a><a href="{{contact}}">{{contactLabel}}</a></footer>
