<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#471616" />
    <link rel="icon" href="/assets/img/logo.png" />
    <!--seo-->
    <style>
      html.language-pending #root {
        visibility: hidden;
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement,
          w = root.clientWidth,
          d = w >= 1024,
          b = d ? 1440 : 390,
          z = Math.min(w, d ? 1440 : 600) / b;
        root.style.setProperty(d ? "--zd" : "--zm", z);
        root.style.setProperty(
          d ? "--gxd" : "--gxm",
          Math.max(0, (w - b * z) / 2) / z + "px",
        );
        var query = new URLSearchParams(location.search),
          language =
            location.pathname.indexOf("/tr/articles") === 0
              ? "tr"
              : location.pathname.indexOf("/articles") === 0
                ? "ar"
                : query.get("lang");
        try {
          language =
            language ||
            (localStorage.getItem("durob-language") === "tr" ? "tr" : "ar");
        } catch (e) {
          language = language || "ar";
        }
        if (language !== root.lang) {
          root.classList.add("language-pending");
          setTimeout(function () {
            root.classList.remove("language-pending");
          }, 5000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
